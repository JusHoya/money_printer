repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python]
      - id: ruff-format
        types_or: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
        # The 500 KB ceiling stays in force for everything except the four
        # PRD Phase 2 evidence artifacts named below. They are listed
        # individually, not waved through by raising the limit, so the
        # exemption stays countable and anything new still trips the gate.
        #
        #   forecast_series_gfs_mex.csv (2.3 MB) and forecast_series_gefs.csv
        #     (887 KB) are the paired forecast records the calibration is fit
        #     on. Phase 2 exit criterion 2 requires the calibration to
        #     recompute byte-identically from its inputs, and the artifacts
        #     hash these files by content -- so they are the evidence, not a
        #     convenience copy.
        #   gefs_manifest.json (1.8 MB) records all 8,820 ranged S3 reads of
        #     the GEFS backfill with their byte offsets. It is the provenance
        #     that makes the backfill checkable rather than merely asserted.
        #   *.grib2.b64 (570 KB) is one real GRIB2 message, base64-encoded so
        #     the in-house decoder's tests run offline and deterministically.
        #     Stored as text on purpose: .gitattributes normalizes line
        #     endings under tests/fixtures/, which would corrupt raw binary.
        #
        # Two PRD Phase 4 evidence artifacts join them on the same terms:
        #
        #   gas_quote_tape.csv (7.9 MB) is 39,623 hourly yes_bid/yes_ask
        #     candles over 405 markets -- the ONLY historical gas orderbook
        #     this project will ever hold. Kalshi prunes settled markets from
        #     the public API after ~60 days, so the events it covers are
        #     already unfetchable: this file cannot be regenerated, only lost.
        #     The Phase 4 backtest replays it to produce the phase verdict and
        #     a test hashes its on-disk bytes against a committed manifest.
        #   phase4_backtest_data_<date>.json (617 KB) is the machine-readable
        #     companion to the artifact that carries the verdict. A test
        #     asserts it cannot disagree with the markdown, so it is evidence
        #     rather than a convenience copy. Matched by date pattern because
        #     the filename is generated, not because the shape is open-ended.
        exclude: |
          (?x)^(
            data/forecast_archive/forecast_series_(gfs_mex|gefs)\.csv|
            data/forecast_archive/gefs_manifest\.json|
            tests/fixtures/ensemble/.*\.grib2\.b64|
            reports/phase4/gas_quote_tape\.csv|
            reports/phase4/phase4_backtest_data_\d{4}-\d{2}-\d{2}\.json
          )$
      - id: check-merge-conflict

  # mypy disabled in pre-commit — 67 pre-existing type errors in legacy code.
  # Re-enable after Sprint 7 cleanup. Run manually: python -m mypy src/ml/ src/backtest/
